<!doctype html>
<html lang="lt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Nėra interneto · Dienos planas</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/pwa/offline.css">
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" width="72" height="72" alt="">
      <p class="eyebrow">DIENOS PLANAS</p>
      <h1>Nėra interneto ryšio</h1>
      <p id="offline-message">Tikrinama, ar šiame įrenginyje yra galiojantis paskutinės pasirinktos dienos planas.</p>
      <section id="offline-plan" hidden aria-labelledby="offline-plan-title">
        <div class="planHeading">
          <div><p class="eyebrow">TIK SKAITYMUI</p><h2 id="offline-plan-title"></h2></div>
          <small id="offline-plan-age"></small>
        </div>
        <ul id="offline-plan-items"></ul>
        <p class="privacyNote">Šioje kopijoje nėra aprašymų, dalyvių, nuorodų ar prisijungimo žetonų. Redaguoti galėsi atkūrus ryšį.</p>
      </section>
      <button id="offline-retry" type="button">Bandyti dar kartą</button>
      <p id="offline-retry-status" class="retryStatus" role="status" aria-live="polite"></p>
    </main>
    <script src="/pwa/offline-plan.js" defer></script>
  </body>
</html>
